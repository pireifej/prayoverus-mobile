name: Hook Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Jest hook tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: expo-app/yarn.lock

      - name: Install dependencies
        working-directory: expo-app
        run: yarn install --frozen-lockfile

      - name: Run hook tests
        working-directory: expo-app
        run: yarn jest --no-coverage
